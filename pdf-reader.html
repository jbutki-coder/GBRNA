<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Archive PDF Reader</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #0f2c47;
      --navy-2: #173f63;
      --paper: #ece8df;
      --ink: #1e252a;
      --muted: #657078;
      --line: #c8c1b5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .reader-toolbar {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .65rem;
      align-items: center;
      padding:
        max(.55rem, env(safe-area-inset-top))
        max(.65rem, env(safe-area-inset-right))
        .55rem
        max(.65rem, env(safe-area-inset-left));
      color: #fff;
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      box-shadow: 0 5px 18px rgba(0, 0, 0, .24);
    }

    .reader-heading {
      min-width: 0;
    }

    .reader-kicker {
      margin: 0 0 .1rem;
      font-size: .64rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .75;
    }

    .reader-title {
      margin: 0;
      overflow: hidden;
      font-size: .95rem;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: .35rem;
    }

    .reader-controls button {
      min-width: 2.35rem;
      min-height: 2.15rem;
      padding: .42rem .58rem;
      border: 1px solid rgba(255, 255, 255, .4);
      border-radius: .42rem;
      color: #fff;
      background: rgba(255, 255, 255, .1);
      font: inherit;
      font-size: .8rem;
      font-weight: 800;
      cursor: pointer;
    }

    .reader-controls button:active {
      background: rgba(255, 255, 255, .24);
    }

    .reader-controls button:disabled {
      cursor: default;
      opacity: .45;
    }

    .reader-main {
      position: relative;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
      scroll-behavior: smooth;
    }

    .reader-status {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      padding: .45rem .7rem;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 244, 238, .96);
      color: var(--muted);
      font-size: .75rem;
      backdrop-filter: blur(8px);
    }

    .page-list {
      display: grid;
      gap: 1rem;
      justify-items: center;
      padding: 1rem .5rem 3rem;
    }

    .pdf-page {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 1100px);
      min-height: 65vh;
      overflow: hidden;
      border: 1px solid #b8b0a3;
      border-radius: .35rem;
      background: #fff;
      box-shadow: 0 7px 22px rgba(0, 0, 0, .16);
    }

    .pdf-page canvas {
      display: block;
      max-width: none;
      background: #fff;
    }

    .page-label {
      position: absolute;
      top: .35rem;
      left: .4rem;
      z-index: 3;
      padding: .2rem .38rem;
      border-radius: .3rem;
      color: #fff;
      background: rgba(15, 44, 71, .8);
      font-size: .68rem;
      font-weight: 800;
      pointer-events: none;
    }

    .page-loading {
      color: var(--muted);
      font-size: .85rem;
    }

    .reader-error {
      max-width: 720px;
      margin: 2rem auto;
      padding: 1rem;
      border: 1px solid #b85656;
      border-radius: .5rem;
      background: #fff2f2;
      color: #6c1717;
      line-height: 1.5;
    }

    @media (max-width: 680px) {
      .reader-toolbar {
        align-items: start;
        grid-template-columns: minmax(0, 1fr) auto;
        padding-bottom: .48rem;
      }

      .reader-title {
        max-width: 48vw;
        font-size: .82rem;
        white-space: normal;
      }

      .reader-controls {
        max-width: 48vw;
      }

      .reader-controls button {
        min-width: 2.05rem;
        min-height: 2rem;
        padding: .36rem .48rem;
        font-size: .72rem;
      }

      .pdf-page {
        min-height: 55vh;
      }
    }
  
    .reader-error strong { display: block; margin-bottom: .55rem; }
    .reader-error p { margin: 0 0 .8rem; }
    .reader-error-actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .8rem; }
    .reader-error-actions button { padding: .65rem .85rem; border: 0; border-radius: .42rem; background: var(--navy); color: #fff; font-weight: 800; }
  </style>
</head>
<body>
  <header class="reader-toolbar">
    <div class="reader-heading">
      <p class="reader-kicker">Multipage Archive PDF Reader</p>
      <h1 class="reader-title" id="readerTitle">Loading PDF…</h1>
    </div>

    <div class="reader-controls" aria-label="PDF reader controls">
      <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <button id="zoomReset" type="button" aria-label="Reset zoom">
        <span id="zoomLabel">100%</span>
      </button>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="fitWidth" type="button">Fit</button>
      <button id="closeReader" type="button">Back</button>
    </div>
  </header>

  <main class="reader-main" id="readerMain">
    <div class="reader-status">
      <span id="pageStatus">Preparing document…</span>
      <span id="loadStatus">Connecting…</span>
    </div>

    <div class="page-list" id="pageList"></div>
  </main>

  <script type="module" src="/js/pdf-reader.mjs?v=20260722-exact-site-v6"></script>
</body>
</html>
