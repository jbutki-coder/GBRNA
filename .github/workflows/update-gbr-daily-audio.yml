name: Update GBR Daily Audio Map

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_gbr_audio_map.py"
      - ".github/workflows/update-gbr-daily-audio.yml"

permissions:
  contents: write

jobs:
  build-audio-map:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdown
        run: python -m pip install --disable-pip-version-check gdown==6.1.0

      - name: Build complete daily audio map
        run: python tools/build_gbr_audio_map.py

      - name: Commit map when it changed
        run: |
          if git diff --quiet -- data/gbr-daily-audio.json; then
            echo "Audio map is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gbr-daily-audio.json
          git commit -m "Update GBR daily audio map"
          git push
